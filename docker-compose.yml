services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-qik}
      POSTGRES_USER: ${DATABASE_USER:-qik}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/setup.sh first}
    volumes:
      - qik-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${QIK_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-qik}
      DATABASE_USER: ${DATABASE_USER:-qik}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/setup.sh first}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup.sh first}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Run scripts/setup.sh first}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      QIK_ADMIN_EMAIL: ${QIK_ADMIN_EMAIL:-}
      QIK_ADMIN_PASSWORD: ${QIK_ADMIN_PASSWORD:-}
    ports:
      - "${QIK_BIND_ADDRESS:-127.0.0.1}:${QIK_HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  qik-data:

spring.application.name=qik-backend
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:qik}}
spring.datasource.username=${DATABASE_USER:qik}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
qik.jwt.secret=${JWT_SECRET}
qik.jwt.expiration-minutes=60
server.error.include-message=always
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
qik.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

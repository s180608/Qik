name: QIK checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: qik-backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: chmod +x qik-backend/mvnw && ./qik-backend/mvnw -f qik-backend/pom.xml verify
      - run: node --check qik-backend/src/main/resources/static/app.js
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qik-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qik-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run export:customer && npm run export:rider
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
